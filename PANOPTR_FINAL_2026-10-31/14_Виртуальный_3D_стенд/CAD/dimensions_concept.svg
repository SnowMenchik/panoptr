<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><rect width="1400" height="880" fill="#edf3f5"/><g font-family="Segoe UI" fill="#183849"><text x="40" y="48" font-size="29">Размерная компоновка • метры • эскиз, не рабочий чертёж</text><rect x="80" y="120" width="450" height="600" fill="#becfcd" stroke="#234e62"/><path d="M153 120 V720 M457 120 V720" stroke="#405564" stroke-width="14"/><text x="190" y="105" font-size="22">4.0 × 2.25м: основание</text><text x="184" y="750" font-size="21">1520мм: условная колея</text><path d="M100 300 H510" stroke="#23a3ae" stroke-width="4"/><text x="190" y="288" font-size="18">2м: линия сканирования</text><rect x="665" y="360" width="600" height="150" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="677" y="392" font-size="18">Вид сбоку: плита / путь / направление движения</text><path d="M875 180 L1060 360" stroke="#23a3ae" stroke-width="4"/><rect x="847" y="151" width="56" height="40" fill="#c98538"/><text x="678" y="131" font-size="22">35мм: высота2.114м, наклон60°</text><text x="1010" y="330" font-size="20">Вперёд1.221м</text><rect x="655" y="570" width="660" height="170" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="667" y="602" font-size="18">Кожух: линейный180×320×190мм / передний180×280×190мм</text><text x="675" y="635" font-size="18">Сменное окно85×85×4мм; панели8мм — проектные.</text><text x="675" y="675" font-size="18">Камеры62×62×36.9мм и74×74×78.8мм — номинальные.</text><text x="675" y="710" font-size="18">Nuvo268×400×196мм внутри кондиционируемого отсека.</text><text x="40" y="830" font-size="20">Габарит, допуски, прочность, герметичность и фактическая геометрия состава ещё не подтверждены.</text></g></svg>