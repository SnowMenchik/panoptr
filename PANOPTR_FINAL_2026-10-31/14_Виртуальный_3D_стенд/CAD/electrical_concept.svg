<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><rect width="1400" height="880" fill="#edf3f5"/><g font-family="Segoe UI" fill="#183849"><text x="40" y="48" font-size="29">Питание и интерфейсы • концепция одного диагностического комплекта</text><text x="40" y="83" font-size="18">Вход110ВDC — допущение; защита, номиналы и монтаж согласуются с владельцем состава.</text><rect x="40" y="130" width="300" height="90" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="52" y="162" font-size="18">Борт110В → защита / фильтр</text><path d="M190 220 V250 H190 V285" fill="none" stroke="#c17a26" stroke-width="3"/><rect x="40" y="285" width="380" height="80" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="52" y="317" font-size="18">RSD500D24 / ветвьPC</text><rect x="40" y="405" width="380" height="95" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="52" y="437" font-size="18">UPS24В20A → Nuvo / 2GPU</text><path d="M230 365 V405" stroke="#c17a26" stroke-width="3"/><path d="M190 220 V250 H635 V285" fill="none" stroke="#c17a26" stroke-width="3"/><rect x="485" y="285" width="380" height="80" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="497" y="317" font-size="18">RSD500D24 / ветвьсвета</text><rect x="485" y="405" width="380" height="95" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="497" y="437" font-size="18">Драйверы → 2светильника</text><path d="M675 365 V405" stroke="#c17a26" stroke-width="3"/><path d="M190 220 V250 H1080 V285" fill="none" stroke="#c17a26" stroke-width="3"/><rect x="930" y="285" width="380" height="80" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="942" y="317" font-size="18">RSD500D24 / ветвькамер</text><rect x="930" y="405" width="380" height="95" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="942" y="437" font-size="18">Камеры / PTC / TEC / очистка</text><path d="M1120 365 V405" stroke="#c17a26" stroke-width="3"/><text x="40" y="535" font-size="20">Раздельные выходы. Без параллельного соединения. В каждой ветви DCпредохранитель и контроль.</text><rect x="40" y="590" width="300" height="70" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="52" y="622" font-size="18">Линейная: 2SDR80-bit</text><rect x="370" y="590" width="260" height="70" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="382" y="622" font-size="18">MVGC1102IOL / PCIe</text><rect x="690" y="590" width="260" height="70" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="702" y="622" font-size="18">Nuvo / вход10GigE</text><rect x="1030" y="590" width="320" height="70" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="1042" y="622" font-size="18">Передняя: 10GigE</text><path d="M340 625 H370 M630 625 H690 M1030 625 H950" stroke="#287b94" stroke-width="4"/><rect x="40" y="715" width="430" height="70" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="52" y="747" font-size="18">Внешняя одометрия / счётчик / время</text><rect x="520" y="715" width="810" height="70" rx="8" fill="#dbe8ed" stroke="#286176" stroke-width="2"/><text x="532" y="747" font-size="18">Nuvo → архивPLP / RS485 → лампы24В (не тормоза)</text><path d="M470 750 H520" stroke="#287b94" stroke-width="4"/><text x="40" y="845" font-size="19">UPS / батарея, теплоотвод и кабели подбираются по реальной конфигурации. Нет физической проверки.</text></g></svg>